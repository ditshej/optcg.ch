# Links for the "Navigation Room" room (Events, Nami).
# See docs/plan.md (section 5) for the full data model and
# data/schema/links.schema.json for the exact field rules.
#
# How to add a link:
#   1. Copy the commented example below and remove the leading "# ".
#   2. Fill in id, title, url, description, language and icon_source.
#   3. id must be unique across all data/links/*.yaml files.
#   4. url must start with https:// and must not contain tracking
#      parameters (utm_*, fbclid, gclid, ...).
#   5. icon and tags are optional; icon defaults to <id>.png if omitted.
#   6. Save and open a pull request. CI validates this file.
#
# Example:
#   - id: example-link
#     title: Example Link
#     url: "https://example.com"
#     description: "One sentence describing what this link is for."
#     language: en
#     icon_source: fetched
#     tags: [example]
#     featured: false

links:
  - id: egman-events
    title: Egman Events
    url: "https://deckbuilder.egmanevents.com/optcg/tournaments"
    description: "Tournament results, decklists and livestream archive for One Piece events."
    language: en
    icon_source: fetched

  - id: official-events
    title: Official Events
    url: "https://en.onepiece-cardgame.com/events/"
    description: "Official calendar of store tournaments and events from Bandai."
    language: en
    icon_source: fetched

  - id: limitless-tcg
    title: Limitless TCG Results
    url: "https://onepiece.limitlesstcg.com/"
    description: "Tournament results, standings and decklists from events around the world."
    language: en
    icon_source: fetched
