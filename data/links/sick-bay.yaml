# Links for the "Sick Bay" room (New Players).
# See docs/plan.md (section 5) for the full data model and
# data/schema/links.schema.json for the exact field rules.
#
# How to add a link:
#   1. Copy the commented example below and remove the leading "# ".
#   2. Fill in id, title, url, description, language and icon_source.
#   3. id must be unique across all data/links/*.yaml files.
#   4. url must start with https:// and must not contain tracking
#      parameters (utm_*, fbclid, gclid, ...).
#   5. icon and tags are optional; icon defaults to <id>.png if omitted.
#   6. Save and open a pull request. CI validates this file.
#
# Example:
#   - id: example-link
#     title: Example Link
#     url: "https://example.com"
#     description: "One sentence describing what this link is for."
#     language: en
#     icon_source: fetched
#     tags: [example]
#     featured: false

links:
  - id: official-play-guide
    title: Official Play Guide
    url: "https://en.onepiece-cardgame.com/play-guide/"
    description: "One-page official quick-reference card: turn phases, zones and card types for your first games."
    language: en
    icon_source: fetched

  - id: official-faq
    title: Official FAQ
    url: "https://en.onepiece-cardgame.com/rules/faq/"
    description: "Official FAQ answering common rules questions and edge cases that trip up new players."
    language: en
    icon_source: fetched

  - id: official-teaching-app
    title: Teaching App
    url: "https://app.onepiece-cardgame.com/en/"
    description: "Official browser app that walks new players through a guided practice game, no download needed."
    language: en
    icon_source: fetched
