# Links for the "Soldier Dock" room (Deckbuilding).
# See docs/plan.md (section 5) for the full data model and
# data/schema/links.schema.json for the exact field rules.
#
# How to add a link:
#   1. Copy the commented example below and remove the leading "# ".
#   2. Fill in id, title, url, description, language and icon_source.
#   3. id must be unique across all data/links/*.yaml files.
#   4. url must start with https:// and must not contain tracking
#      parameters (utm_*, fbclid, gclid, ...).
#   5. icon and tags are optional; icon defaults to <id>.png if omitted.
#   6. Save and open a pull request. CI validates this file.
#
# Example:
#   - id: example-link
#     title: Example Link
#     url: "https://example.com"
#     description: "One sentence describing what this link is for."
#     language: en
#     icon_source: fetched
#     tags: [example]
#     featured: false

links:
  - id: egman-deckbuilder
    title: Egman Deckbuilder
    url: "https://deckbuilder.egmanevents.com/optcg/deck"
    description: "Free online deck builder with full card database and tournament-legality checks."
    language: en
    icon_source: fetched

  - id: cardkaizoku-deckbuilder
    title: Car D. Kaizoku Deckbuilder
    url: "https://www.cardkaizoku.com/deckbuilder"
    description: "Free online deck builder for the One Piece Card Game."
    language: en
    icon_source: fetched

  - id: opmetabuilder
    title: OP Meta Builder
    url: "https://opmetabuilder.com/"
    description: "Free deck builder combined with tournament meta analysis and tier tracking."
    language: en
    icon_source: fetched

  - id: limitless-deckbuilder
    title: Limitless Deck Builder
    url: "https://my.limitlesstcg.com/builder?game=OP"
    description: "Deck builder (beta) from Limitless TCG with card search, prices and playtesting."
    language: en
    icon_source: fetched

  - id: oplaytcg-deckbuilder
    title: OPlayTCG Deck Builder
    url: "https://oplaytcg.com/en/deck-builder"
    description: "Browse the full card library and build a 50-card deck around your leader, no install."
    language: en
    icon_source: fetched
