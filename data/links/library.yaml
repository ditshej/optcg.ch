# Links for the "Library" room (Rules & Cards).
# See docs/plan.md (section 5) for the full data model and
# data/schema/links.schema.json for the exact field rules.
#
# How to add a link:
#   1. Copy the commented example below and remove the leading "# ".
#   2. Fill in id, title, url, description, language and icon_source.
#   3. id must be unique across all data/links/*.yaml files.
#   4. url must start with https:// and must not contain tracking
#      parameters (utm_*, fbclid, gclid, ...).
#   5. icon and tags are optional; icon defaults to <id>.png if omitted.
#   6. Save and open a pull request. CI validates this file.
#
# Example:
#   - id: example-link
#     title: Example Link
#     url: "https://example.com"
#     description: "One sentence describing what this link is for."
#     language: en
#     icon_source: fetched
#     tags: [example]
#     featured: false

links:
  - id: official-how-to-play
    title: Official Rules
    url: "https://en.onepiece-cardgame.com/beginners/how-to-play.php"
    description: "Official step-by-step rules and how-to-play guide from Bandai."
    language: en
    icon_source: fetched

  - id: official-rulebook
    title: Official Rulebook
    url: "https://en.onepiece-cardgame.com/rules/"
    description: "Official full rulebook and rules reference for the One Piece Card Game, from Bandai."
    language: en
    icon_source: fetched

  - id: cardkaizoku-cards
    title: Car D. Kaizoku Cards
    url: "https://www.cardkaizoku.com/cards"
    description: "Searchable card database for the One Piece Card Game with all sets."
    language: en
    icon_source: fetched

  - id: cardkaizoku-spoilers
    title: Car D. Kaizoku Spoilers
    url: "https://www.cardkaizoku.com/spoilers"
    description: "Newly revealed cards from upcoming One Piece Card Game sets."
    language: en
    icon_source: fetched
