# Links for the "Crow's Nest" room (Training, Zoro).
# See docs/plan.md (section 5) for the full data model and
# data/schema/links.schema.json for the exact field rules.
#
# How to add a link:
#   1. Copy the commented example below and remove the leading "# ".
#   2. Fill in id, title, url, description, language and icon_source.
#   3. id must be unique across all data/links/*.yaml files.
#   4. url must start with https:// and must not contain tracking
#      parameters (utm_*, fbclid, gclid, ...).
#   5. icon and tags are optional; icon defaults to <id>.png if omitted.
#   6. Save and open a pull request. CI validates this file.
#
# Example:
#   - id: example-link
#     title: Example Link
#     url: "https://example.com"
#     description: "One sentence describing what this link is for."
#     language: en
#     icon_source: fetched
#     tags: [example]
#     featured: false

links:
  - id: egman-deckbuilder
    title: Egman Deckbuilder
    url: "https://deckbuilder.egmanevents.com/optcg/deck"
    description: "Free online deck builder with full card database and tournament-legality checks."
    language: en
    icon_source: fetched

  - id: opmetagame
    title: OP Metagame
    url: "https://opmetagame.com/"
    description: "Tournament-data meta tier list with win rates for the current format."
    language: en
    icon_source: fetched

  - id: oplaytcg-simulator
    title: OPlayTCG Simulator
    url: "https://oplaytcg.com/play"
    description: "Free browser simulator to test decks against real opponents, no install."
    language: en
    icon_source: fetched
