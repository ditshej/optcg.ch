# Links for the "Aquarium Bar" room (Media, Brook).
# See docs/plan.md (section 5) for the full data model and
# data/schema/links.schema.json for the exact field rules.
#
# How to add a link:
#   1. Copy the commented example below and remove the leading "# ".
#   2. Fill in id, title, url, description, language and icon_source.
#   3. id must be unique across all data/links/*.yaml files.
#   4. url must start with https:// and must not contain tracking
#      parameters (utm_*, fbclid, gclid, ...).
#   5. icon and tags are optional; icon defaults to <id>.png if omitted.
#   6. Save and open a pull request. CI validates this file.
#
# Example:
#   - id: example-link
#     title: Example Link
#     url: "https://example.com"
#     description: "One sentence describing what this link is for."
#     language: en
#     icon_source: manual
#     tags: [example]
#     featured: false

links:
  - id: uncommon-cards
    title: UnCommon Cards
    url: "https://www.youtube.com/@Un_CommonCards"
    description: "Interviews and discussions with top competitive One Piece TCG players."
    language: en
    icon_source: manual
    featured: true

  - id: deck-in-the-box
    title: Deck In The Box
    url: "https://www.youtube.com/@DeckBoxOPTCG"
    description: "Gameplay, deck techs and tournament coverage for the One Piece Card Game."
    language: en
    icon_source: manual
    featured: true
