# rig-enforcement base 5 (CI template for PHP without Laravel, adapted: no Pint, PHPStan or Pest; project steps kept)
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: curl, dom, gd
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Validate composer.json
        run: composer validate --strict
      - name: Validate data files
        run: composer validate-data
      - name: Lint Twig templates
        run: composer lint:twig
      - name: PHPUnit
        run: composer test

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Lockfiles
        run: |
          status=0
          if [ -f composer.json ] && [ ! -f composer.lock ]; then
            echo "::error file=composer.json::composer.json without composer.lock. Commit the lockfile."
            status=1
          fi
          if [ -f package.json ] && [ ! -f package-lock.json ]; then
            echo "::error file=package.json::package.json without package-lock.json. Commit the lockfile."
            status=1
          fi
          exit $status
      - uses: shivammathur/setup-php@v2
        if: (success() || failure()) && hashFiles('composer.lock') != ''
        with:
          php-version: '8.5'
          extensions: curl, dom, gd
          coverage: none
          tools: composer:v2
      - name: composer audit
        if: (success() || failure()) && hashFiles('composer.lock') != ''
        run: composer audit --locked
      - name: npm audit
        if: (success() || failure()) && hashFiles('package-lock.json') != ''
        run: npm audit --audit-level=high

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  claude-md:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: CLAUDE.md length (warning only)
        run: |
          # With Laravel Boost the project part lives in .ai/guidelines/project.md.
          if [ -f .ai/guidelines/project.md ]; then
            lines=$(wc -l < .ai/guidelines/project.md)
          elif [ -d .ai/guidelines ]; then
            lines=$(cat .ai/guidelines/*.md 2>/dev/null | wc -l)
          elif [ -f CLAUDE.md ]; then
            lines=$(wc -l < CLAUDE.md)
            # Follow @imports one level deep (files in the repository only).
            for f in $(grep -oE '(^|[[:space:]])@[^[:space:]]+' CLAUDE.md | sed 's/^[[:space:]]*@//' | sort -u); do
              case "$f" in /*|~*|*..*) continue ;; esac
              if [ -f "$f" ]; then
                lines=$((lines + $(wc -l < "$f")))
              fi
            done
          else
            exit 0
          fi
          if [ "$lines" -gt 60 ]; then
            echo "::warning file=CLAUDE.md::The project part of CLAUDE.md has $lines lines (guide: about 60)."
          fi