# rig-enforcement CI (neutral; security and gitleaks from ditshej/rig-ci)
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels the older run; runs on main finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: curl, dom, gd
          coverage: none
          tools: composer:v2
      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Validate composer.json
        run: composer validate --strict
      - name: Validate data files
        run: composer validate-data
      - name: Lint Twig templates
        run: composer lint:twig
      - name: PHPUnit
        run: composer test
  security:
    uses: ditshej/rig-ci/.github/workflows/security.yml@v1
    with:
      php-version: '8.5'
  gitleaks:
    uses: ditshej/rig-ci/.github/workflows/gitleaks.yml@v1
    permissions:
      contents: read
      pull-requests: read